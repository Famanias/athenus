# Athenus — Development Stack (CPU default)
# Single command: docker compose up -d --build  ->  http://localhost:3000
# GPU-accelerated: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# Desktop (Tauri): docker compose up -d backend  ->  npm run tauri dev (native)
name: athenus

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.dev
    container_name: athenus-backend
    ports:
      - "${PORT_BACKEND:-8000}:8000"
    env_file:
      - .env
    environment:
      # Container-friendly overrides. Native values stay in .env.example.
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: "sqlite:////app/data/athenus.db"
      QDRANT_PATH: "/app/data/qdrant"
      UPLOADS_DIR: "/app/data/uploads"
      # Containerized Ollama (default). For host Ollama use http://host.docker.internal:11434.
      OLLAMA_BASE_URL: "http://ollama:11434"
      WHISPER_DEVICE: "cpu"
      WHISPER_COMPUTE_TYPE: "int8"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - hf-cache:/root/.cache/huggingface
    extra_hosts:
      # Enables host Ollama fallback on Linux (and is a no-op-equivalent elsewhere).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      - ollama
    networks:
      - athenus-net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.dev
    container_name: athenus-frontend
    ports:
      - "${PORT_FRONTEND:-3000}:3000"
    environment:
      # Browser runs on the host, so it must reach the backend via localhost.
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: [ "npm", "run", "dev", "--", "-H", "0.0.0.0" ]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - athenus-net

  ollama:
    image: ollama/ollama:latest
    container_name: athenus-ollama
    ports:
      - "${PORT_OLLAMA:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
      - E:\ollama\models:/root/.ollama/models
    networks:
      - athenus-net

networks:
  athenus-net:
    driver: bridge

volumes:
  # Avoids re-downloading BGE/Whisper models on every rebuild.
  hf-cache: # Persists pulled GGUF weights (e.g. llama3:8b).

  ollama-data:
